name: protos
on:
  push:
    branches: [main]
    paths: ["categories.json", "embed_texts.py"]
permissions:
  contents: write
jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install sentence-transformers numpy && mkdir -p results && python embed_texts.py
      - run: |
          git config user.name "crawl-bot"; git config user.email "crawl-bot@users.noreply.github.com"
          git add results/category_proto* && git commit -m "Category prototypes" && git pull --rebase && git push
